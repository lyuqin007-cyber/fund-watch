name: Fund Watch Daily Report

on:
  schedule:
    # UTC 06:20 = 北京时间 14:20（中国无夏令时，固定+8）。
    # 提前于15:00收盘40分钟，留出 GitHub 排队延迟缓冲（定时任务可能延迟数分钟~数小时）。
    - cron: '20 6 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: '忽略休市判断，强制生成报告（测试用）'
        type: boolean
        default: false

concurrency:
  group: fund-watch
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
      # AI 通道：当前用代理（方案A）；以后若换 Anthropic 官方，改配 ANTHROPIC_API_KEY 即可
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      FORCE: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch fund data
        run: python scripts/fetch_data.py
      - name: Analyze and push report
        run: python scripts/analyze.py
      - name: Commit reports back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ data/ || true
          git commit -m "daily report $(date +%F)" || echo "no changes to commit"
          git push
