name: Fund Watch Daily Report

on:
  # 【2026-10-21 已停用自动推送】用户要求全部停发微信报告，所以定时触发放注释掉了。
  # 恢复方法：把下面 schedule 那几行的注释去掉、提交推送即可。
  # 手动跑不受影响：Actions 页面点 Run workflow 仍可生成报告（不会推微信则需改脚本参数）。
  # schedule:
  #   # UTC 06:20 = 北京时间 14:20（中国无夏令时，固定+8）。
  #   # 备份触发：主触发为外部闹钟 cron-job.org 14:10（更准时）；
  #   # 防重复开关保证双触发不会重复推送、重复花 AI 费用。
  #   - cron: '20 6 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: '忽略休市判断，强制生成报告（测试用）'
        type: boolean
        default: false

concurrency:
  group: fund-watch
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  report:
    # 【2026-10-21 停发保险】只有手动勾选 force 时才执行；
    # 外部闹钟 cron-job.org 的自动触发不传 force → 直接跳过，不会再发微信。
    if: github.event.inputs.force == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
      # AI 通道：Anthropic 官方 API（本地开发可自行设代理环境变量，云端不受影响）
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      FORCE: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch fund data
        run: python scripts/fetch_data.py
      - name: Analyze and push report
        run: python scripts/analyze.py
      - name: Commit reports back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ data/ || true
          git commit -m "daily report $(date +%F)" || echo "no changes to commit"
          # 推送带重试：网络偶发抽风时退避重试（先同步远端，防竞态）
          for i in 1 2 3; do
            git fetch origin && git rebase FETCH_HEAD && git push && break
            echo "推送失败第${i}次，10秒后重试"
            sleep 10
          done
